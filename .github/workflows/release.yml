name: Build Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp keystore/debug.keystore "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp "app/build/outputs/apk/debug/我的电视 本地版.apk" "dist/我的电视-本地版-${GITHUB_REF_NAME}.apk"

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.assets[].id' 2>/dev/null | while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" || true
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 我的电视 本地版 ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
